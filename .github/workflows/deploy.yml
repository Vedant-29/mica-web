name: Deploy to Cloudflare Pages

# Build and publish to the existing `mica` Pages project on every push to main.
# The project already owns mica.vedantagrw.com, so this only uploads new static
# output — no domain reconfiguration.
#
# This file is public and that is fine. The Cloudflare token lives in repository
# secrets: encrypted at rest, masked in logs, and never handed to workflows
# triggered from forks. A public workflow referencing ${{ secrets.X }} discloses
# the name of a secret, not its value.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# The bundled JS actions still target Node 20, which is being removed from the
# runners; opt them into Node 24 now rather than waiting for the break.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name mica --branch main
